name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout submodules
      run: |
        auth_header=$(printf "Authorization: Bearer %s" "$GITHUB_TOKEN" | base64 -w0)
        git config --global http.extraHeader "Authorization: Bearer $GITHUB_TOKEN"
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init --recursive || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        sdkmanager "ndk;27.0.12077973"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

    - name: Install CMake
      run: |
        sdkmanager "cmake;3.22.1"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release APK
      run: ./gradlew assembleRelease --no-daemon --stacktrace
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      continue-on-error: false

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: app-release
        path: ./release-apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./release-apk/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
